name: CI
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  build:
    name: Typecheck, test, audit and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Dependency audit
        run: pnpm audit --prod
      - name: Build
        run: pnpm build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Secret scan
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks_8.28.0_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.28.0_linux_x64.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .

  docker:
    name: Docker quick start (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start with Docker Compose, as in the README
        run: |
          cp .env.example .env
          sed -i "s/^OPENAI_API_KEY=.*/OPENAI_API_KEY=sk-ci-placeholder/" .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:3000/api/healthz && break; sleep 2; done
          curl -fs http://127.0.0.1:3000/api/healthz
      - name: Chromium starts inside the container
        run: |
          docker compose exec -T amuse node -e "import('playwright-core').then(async ({ chromium }) => { const b = await chromium.launch({ chromiumSandbox: false }); const p = await b.newPage(); await p.setContent('<h1>ok</h1>'); console.log(await p.textContent('h1')); await b.close(); })"
      - name: Logs
        if: always()
        run: docker compose logs --no-color | tail -100
